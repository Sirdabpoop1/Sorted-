<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Display</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class = "grid">
        {% for info in info %}
        <h4>{{info.school:}}</h4>
        {% endfor %}
    </div>
</body>
</html>
